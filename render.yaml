services:
  - type: web
    name: ecommerce-book
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://ecommerce-book-one.vercel.app
      # Vercel rewrite -> Cloudflare -> Render load balancers: the visitor is the 4th address from the right in X-Forwarded-For.
      # Check /api/security/network as admin: ip must equal your public address.
      - key: TRUST_PROXY_HOPS
        value: "4"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SHIPPING_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
